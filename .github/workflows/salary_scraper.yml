name: Salary Scraper — Daily Run
 
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Which scrapers to run (adzuna | itjobswatch | all)"
        required: false
        default: "all"
 
permissions:
  contents: write
 
jobs:
 
  # ── Adzuna: 5 паралельних jobs по країнах ────────────────────
  scrape-adzuna:
    name: "Adzuna — ${{ matrix.country }}"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sources == 'adzuna' || github.event.inputs.sources == 'all' || github.event_name == 'schedule' }}
 
    strategy:
      matrix:
        country: [PL, UK, US, DE, NL]
      fail-fast: false   # якщо одна країна впала — решта продовжують
 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r salary_scraper/requirements.txt
      - run: mkdir -p salary_scraper/data salary_scraper/logs
 
      - name: Run Adzuna scraper (${{ matrix.country }})
        env:
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SCRAPE_COUNTRY: ${{ matrix.country }}
        run: python salary_scraper/scrapers/adzuna_scraper.py
 
      - name: Validate output
        id: validate
        run: |
          FILE="salary_scraper/data/adzuna_all.csv"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi
          ROWS=$(tail -n +2 "$FILE" | wc -l)
          echo "Rows in file: $ROWS"
          if [ "$ROWS" -lt 1 ]; then
            echo "ERROR: file is empty"
            exit 1
          fi
          echo "OK: $ROWS rows"
 
      - name: Upload artifact (${{ matrix.country }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adzuna-${{ matrix.country }}-${{ github.run_id }}
          path: salary_scraper/data/adzuna_all.csv
          retention-days: 90
 
  # ── Merge: об'єднуємо результати по країнах в один файл ──────
  merge-adzuna:
    name: "Merge Adzuna results"
    runs-on: ubuntu-latest
    needs: scrape-adzuna
    if: always()
 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas
      - run: mkdir -p salary_scraper/data
 
      # Скачуємо артефакти по всіх країнах
      - name: Download PL artifact
        uses: actions/download-artifact@v4
        with:
          name: adzuna-PL-${{ github.run_id }}
          path: /tmp/adzuna_parts/PL
        continue-on-error: true
 
      - name: Download UK artifact
        uses: actions/download-artifact@v4
        with:
          name: adzuna-UK-${{ github.run_id }}
          path: /tmp/adzuna_parts/UK
        continue-on-error: true
 
      - name: Download US artifact
        uses: actions/download-artifact@v4
        with:
          name: adzuna-US-${{ github.run_id }}
          path: /tmp/adzuna_parts/US
        continue-on-error: true
 
      - name: Download DE artifact
        uses: actions/download-artifact@v4
        with:
          name: adzuna-DE-${{ github.run_id }}
          path: /tmp/adzuna_parts/DE
        continue-on-error: true
 
      - name: Download NL artifact
        uses: actions/download-artifact@v4
        with:
          name: adzuna-NL-${{ github.run_id }}
          path: /tmp/adzuna_parts/NL
        continue-on-error: true
 
      - name: Merge into adzuna_all.csv
        run: |
          python3 << 'PYEOF'
          import pandas as pd
          from pathlib import Path
 
          parts_dir = Path("/tmp/adzuna_parts")
          master    = Path("salary_scraper/data/adzuna_all.csv")
          today     = pd.Timestamp.today().strftime("%Y-%m-%d")
 
          # Завантажуємо поточний master як є (не видаляємо нічого)
          if master.exists():
              df_master = pd.read_csv(master)
              print(f"Master loaded: {len(df_master)} rows")
          else:
              df_master = pd.DataFrame()
              print("No existing master -- creating new")
 
          # Збираємо нові дані по країнах (тільки сьогоднішні)
          new_parts = []
          for country_dir in sorted(parts_dir.iterdir()):
              csv_file = country_dir / "adzuna_all.csv"
              if csv_file.exists():
                  df_part = pd.read_csv(csv_file)
                  df_today = df_part[df_part["scrape_date"] == today]
                  if len(df_today) > 0:
                      new_parts.append(df_today)
                      print(f"  {country_dir.name}: {len(df_today)} new rows for {today}")
                  else:
                      print(f"  {country_dir.name}: 0 new rows (all skipped/dedup)")
 
          if not new_parts:
              print(f"No new data for {today} -- master file unchanged")
              exit(0)
 
          df_new = pd.concat(new_parts, ignore_index=True)
          print(f"New data total: {len(df_new)} rows")
 
          # Дедублікація: видаляємо з master рядки що будуть перезаписані
          # (на випадок повторного запуску того ж дня)
          if not df_master.empty:
              key_cols = ["category_djinni", "experience_label", "country", "scrape_date"]
              existing_keys = set(zip(*[df_master[c] for c in key_cols]))
              new_keys = set(zip(*[df_new[c] for c in key_cols]))
              overlap = existing_keys & new_keys
              if overlap:
                  # Видаляємо старі рядки що будуть замінені новими
                  mask = ~df_master.apply(
                      lambda r: (r["category_djinni"], r["experience_label"],
                                 r["country"], r["scrape_date"]) in overlap, axis=1
                  )
                  df_master = df_master[mask]
                  print(f"  Replaced {len(overlap)} existing rows for today")
 
          df_final = pd.concat([df_master, df_new], ignore_index=True) if not df_master.empty else df_new
          df_final = df_final.sort_values(["scrape_date","country","category_djinni"]).reset_index(drop=True)
 
          df_final.to_csv(master, index=False, encoding="utf-8-sig")
          print(f"Saved: {master} ({len(df_final)} total rows)")
          PYEOF
 
      - name: Backup before commit
        run: |
          if [ -f salary_scraper/data/adzuna_all.csv ]; then
            cp salary_scraper/data/adzuna_all.csv salary_scraper/data/adzuna_all_backup.csv
          fi
 
      - name: Commit merged results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add salary_scraper/data/adzuna_all.csv
          if ! git diff --staged --quiet; then
            git commit -m "chore: adzuna data update $(date +%Y-%m-%d)"
            git push origin HEAD || (git pull --rebase origin main && git push origin HEAD)
          else
            echo "No changes to commit"
          fi
 
      - name: Upload final merged artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adzuna-merged-${{ github.run_id }}
          path: salary_scraper/data/adzuna_all.csv
          retention-days: 90
 
  # ── ITJobsWatch: без змін ─────────────────────────────────────
  scrape-itjobswatch:
    name: "ITJobsWatch — UK medians"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sources == 'itjobswatch' || github.event.inputs.sources == 'all' || github.event_name == 'schedule' }}
 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r salary_scraper/requirements.txt
      - run: mkdir -p salary_scraper/data salary_scraper/logs
 
      - name: Backup itjobswatch_all.csv
        run: |
          if [ -f salary_scraper/data/itjobswatch_all.csv ]; then
            cp salary_scraper/data/itjobswatch_all.csv salary_scraper/data/itjobswatch_all_backup.csv
            echo "Backup: $(wc -l < salary_scraper/data/itjobswatch_all.csv) rows"
          fi
 
      - name: Run ITJobsWatch scraper
        run: python salary_scraper/scrapers/itjobswatch_scraper.py
 
      - name: Validate itjobswatch_all.csv
        id: validate_itjw
        run: |
          FILE="salary_scraper/data/itjobswatch_all.csv"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: not found"
            [ -f salary_scraper/data/itjobswatch_all_backup.csv ] && \
              cp salary_scraper/data/itjobswatch_all_backup.csv "$FILE"
            exit 1
          fi
          ROWS=$(tail -n +2 "$FILE" | wc -l)
          if [ "$ROWS" -lt 1 ]; then
            echo "ERROR: empty"
            [ -f salary_scraper/data/itjobswatch_all_backup.csv ] && \
              cp salary_scraper/data/itjobswatch_all_backup.csv "$FILE"
            exit 1
          fi
          echo "OK: $ROWS rows"
 
      - name: Commit ITJobsWatch changes
        if: steps.validate_itjw.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add salary_scraper/data/itjobswatch_all.csv
          if ! git diff --staged --quiet; then
            git commit -m "chore: itjobswatch data update $(date +%Y-%m-%d)"
            git push origin HEAD || (git pull --rebase origin main && git push origin HEAD)
          else
            echo "No changes to commit"
          fi
 
      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itjobswatch-${{ github.run_id }}
          path: salary_scraper/data/itjobswatch_all.csv
          retention-days: 90
