name: Salary Scraper — Daily Run

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Which scrapers to run (adzuna | itjobswatch | all)"
        required: false
        default: "all"

permissions:
  contents: write

jobs:

  scrape-adzuna:
    name: "Adzuna API — PL / UK / US / DE / NL"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sources == 'adzuna' || github.event.inputs.sources == 'all' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r salary_scraper/requirements.txt
      - run: mkdir -p salary_scraper/data salary_scraper/logs
      
      - name: Run Adzuna scraper
        env:
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python salary_scraper/scrapers/adzuna_scraper.py
        
      - name: Commit Adzuna changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add salary_scraper/data/adzuna_all.csv
          git diff --staged --quiet || (git pull --rebase && git commit -m "chore: adzuna data update $(date +%Y-%m-%d)" && git push)

  scrape-itjobswatch:
    name: "ITJobsWatch — UK medians"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sources == 'itjobswatch' || github.event.inputs.sources == 'all' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r salary_scraper/requirements.txt
      - run: mkdir -p salary_scraper/data salary_scraper/logs
      
      - name: Run ITJobsWatch scraper
        run: python salary_scraper/scrapers/itjobswatch_scraper.py
        
      - name: Commit ITJobsWatch changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add salary_scraper/data/itjobswatch_all.csv
          git diff --staged --quiet || (git pull --rebase && git commit -m "chore: itjobswatch data update $(date +%Y-%m-%d)" && git push)


